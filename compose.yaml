services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: perly
      POSTGRES_USER: perly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perly -d perly"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/mdriverpl/perlylubuskie}-api:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql+psycopg://perly:${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD}@db:5432/perly
      SECRET_KEY: ${SECRET_KEY:?Ustaw losowy SECRET_KEY o długości minimum 32 znaków}
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    logging: *logging

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/mdriverpl/perlylubuskie}-web:${IMAGE_TAG:-latest}
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

volumes:
  postgres_data:
