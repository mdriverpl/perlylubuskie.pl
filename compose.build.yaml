services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: perly
      POSTGRES_USER: perly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perly -d perly"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  router:
    build: ./routing
    restart: unless-stopped
    mem_limit: 768m
    read_only: true
    tmpfs: [/tmp]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://perly:${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD}@db:5432/perly
      SECRET_KEY: ${SECRET_KEY:?Ustaw SECRET_KEY w .env}
      CORS_ORIGINS: http://localhost:8080
      ROUTER_URL: http://router:17777/brouter
      HERE_API_KEY: ${HERE_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      router:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
